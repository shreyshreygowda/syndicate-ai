<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <g stroke="#324B90" stroke-width="2.5" fill="none" stroke-linejoin="miter">
    <!-- Top-left: two interlocking squares -->
    <rect x="6" y="6" width="26" height="26"/>
    <rect x="18" y="6" width="26" height="26"/>
    <!-- Top-right -->
    <rect x="48" y="6" width="26" height="26"/>
    <rect x="36" y="6" width="26" height="26"/>
    <!-- Bottom-left -->
    <rect x="6" y="48" width="26" height="26"/>
    <rect x="18" y="48" width="26" height="26"/>
    <!-- Bottom-right -->
    <rect x="48" y="48" width="26" height="26"/>
    <rect x="36" y="48" width="26" height="26"/>
  </g>
</svg>
